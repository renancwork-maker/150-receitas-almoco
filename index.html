<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(145deg, #f0f7f3, #e2eee7);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #20352b;
}

.container {
    width: 100%;
    max-width: 520px;
    background: #ffffff;
    padding: 40px 30px;
    border: 1px solid #dce8e0;
    border-radius: 24px;
    box-shadow: 0 15px 45px rgba(20, 70, 45, .08);
    text-align: center;
}

.icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: #e5f5eb;
    color: #16834b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: bold;
}

.badge {
    display: inline-block;
    color: #16834b;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 14px;
}

.headline {
    font-size: 30px;
    font-weight: 750;
    color: #173b29;
    line-height: 1.2;
    margin-bottom: 16px;
}

.subheadline {
    font-size: 17px;
    color: #607067;
    line-height: 1.6;
    margin-bottom: 30px;
}

.cta-button {
    display: block;
    width: 100%;
    text-decoration: none;
    background: linear-gradient(135deg, #209653, #12713c);
    color: #ffffff;
    padding: 20px;
    border-radius: 12px;
    font-size: 19px;
    font-weight: 700;
    box-shadow: 0 8px 20px rgba(22, 131, 75, .22);
    transition: .2s ease;
}

.cta-button:hover {
    transform: translateY(-2px);
    filter: brightness(1.05);
}

.cta-button:active {
    transform: scale(.98);
}

.cta-button:focus-visible {
    outline: 3px solid #173b29;
    outline-offset: 4px;
}

.info {
    margin-top: 18px;
    font-size: 13px;
    color: #708078;
    line-height: 1.5;
}

.footer {
    border-top: 1px solid #e7eee9;
    padding-top: 20px;
    margin-top: 28px;
    font-size: 12px;
    color: #708078;
    line-height: 1.6;
}

@media (max-width: 480px) {
    .container {
        padding: 32px 22px;
    }

    .headline {
        font-size: 26px;
    }

    .subheadline {
        font-size: 16px;
    }

    .cta-button {
        font-size: 18px;
        padding: 18px 12px;
    }
}
</style>
</head>

<body>

<main class="container">

    <div class="icon" aria-hidden="true">
        ✓
    </div>

    <div class="badge">
        Próxima etapa
    </div>

    <h1 class="headline">
        Tudo pronto para continuar!
    </h1>

    <p class="subheadline">
        Clique no botão abaixo e confira todas as informações na próxima página.
    </p>

    <a href="/pagina" class="cta-button">
        QUERO CONTINUAR →
    </a>

    <div class="info">
        Você será direcionado para a próxima página.
    </div>

    <div class="footer">
        Todos os direitos reservados.
    </div>

</main>

</body>
</html>
